services:
  echo-crate:
    build: .
    container_name: echo-crate
    restart: unless-stopped
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      DATA_DIR: /data
      ECHOCRATE_SECRET: ${ECHOCRATE_SECRET:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8787}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - echocrate-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  echocrate-data:
